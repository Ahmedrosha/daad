name: Build & Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download word lists
        run: |
          mkdir -p Keyboard/Resources "$RUNNER_TEMP/words"
          BASE=https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018
          curl -fsSL "$BASE/ar/ar_50k.txt" -o "$RUNNER_TEMP/words/ar.txt"
          curl -fsSL "$BASE/en/en_50k.txt" -o "$RUNNER_TEMP/words/en.txt"
          perl -CSD -ne 's/\r//; if (/^[\x{0621}-\x{064A}]+ \d+$/) { print; exit if ++$n >= 30000 }' "$RUNNER_TEMP/words/ar.txt" > Keyboard/Resources/words_ar.txt
          perl -ne "s/\r//; if (/^[a-z']+ \d+\$/) { print; exit if ++\$n >= 30000 }" "$RUNNER_TEMP/words/en.txt" > Keyboard/Resources/words_en.txt
          curl -fsSL https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2 -o "$RUNNER_TEMP/words/eng.tsv.bz2" \
            && python3 scripts/build_ngrams.py "$RUNNER_TEMP/words/eng.tsv.bz2" en Keyboard/Resources || echo "English sentences unavailable"
          curl -fsSL https://downloads.tatoeba.org/exports/per_language/ara/ara_sentences.tsv.bz2 -o "$RUNNER_TEMP/words/ara.tsv.bz2" \
            && python3 scripts/build_ngrams.py "$RUNNER_TEMP/words/ara.tsv.bz2" ar Keyboard/Resources || echo "Arabic sentences unavailable"
          wc -l Keyboard/Resources/*.txt
          head -n 3 Keyboard/Resources/words_ar.txt Keyboard/Resources/words_en.txt

      - name: Generate Xcode project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey.p8"

      - name: Verify App Store Connect API key
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$HOME/private_keys/AuthKey.p8"
          echo "Key ID length: ${#KID} (should be 10)"
          echo "Issuer ID length: ${#ISS} (should be 36)"
          echo "Key file lines: $(wc -l < "$KEY" | tr -d ' ')"
          grep -q "BEGIN PRIVATE KEY" "$KEY" && echo "BEGIN line: found" || echo "BEGIN line: MISSING"
          grep -q "END PRIVATE KEY" "$KEY" && echo "END line: found" || echo "END line: MISSING"
          ruby -ropenssl -rbase64 -rjson -rnet/http -e '
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            begin
              key = OpenSSL::PKey::EC.new(File.read(File.join(Dir.home, "private_keys/AuthKey.p8")))
            rescue => e
              puts "❌ The .p8 text in ASC_PRIVATE_KEY is not a valid private key: #{e.message}"
              exit 1
            end
            now = Time.now.to_i
            head = b64.(JSON.generate(alg: "ES256", kid: ENV["KID"].strip, typ: "JWT"))
            body = b64.(JSON.generate(iss: ENV["ISS"].strip, iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
            input = "#{head}.#{body}"
            der = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
            sig = der.value.map { |v| v.value.to_s(2).rjust(32, "\0") }.join
            uri = URI("https://api.appstoreconnect.apple.com/v1/apps?limit=1")
            req = Net::HTTP::Get.new(uri)
            req["Authorization"] = "Bearer #{input}.#{b64.(sig)}"
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
            if res.code == "200"
              puts "✅ API key works with Apple"
            else
              puts "❌ Apple rejected the key (HTTP #{res.code}): #{res.body}"
              puts "Key ID, Issuer ID and the .p8 file must all belong to the SAME key."
              exit 1
            end
          '

      - name: Create temporary signing certificate and profiles
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          WORK: ${{ runner.temp }}/signing
        run: |
          export KEY_PATH="$HOME/private_keys/AuthKey.p8"
          ruby scripts/asc_signing.rb setup
          P=$(openssl rand -hex 16)
          cd "$WORK"
          /usr/bin/openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout pass:$P
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "$P" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$P" "$KC"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o wwdr.cer
          security import wwdr.cer -k "$KC" -A || true
          security import dist.p12 -P "$P" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$P" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f dist.key dist.p12
          security find-identity -v -p codesigning "$KC"

      - name: Use the temporary profiles
        run: |
          printf 'CODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Distribution\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$APP_PROFILE" > Config/App.xcconfig
          printf 'CODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Distribution\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$EXT_PROFILE" > Config/Ext.xcconfig
          DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project Daad.xcodeproj \
            -scheme Daad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Daad.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.daad.keyboard</key><string>$APP_PROFILE</string>
              <key>com.daad.keyboard.ext</key><string>$EXT_PROFILE</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Daad.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Delete temporary certificate and profiles
        if: always()
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          WORK: ${{ runner.temp }}/signing
        run: |
          export KEY_PATH="$HOME/private_keys/AuthKey.p8"
          ruby scripts/asc_signing.rb cleanup
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" || true
