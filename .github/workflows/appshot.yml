name: App screenshots (simulator, no upload)

# Runs the app on a simulator and saves screenshots of the Home screen (purchase card).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"

      - name: Generate project
        run: |
          brew install xcodegen
          mkdir -p Keyboard/Resources
          xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project Daad.xcodeproj -scheme Daad -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -3

      - name: Take screenshots
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; l=[x for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']]; print(l[-1]['udid'])")
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$SIM" build/Build/Products/Debug-iphonesimulator/Daad.app
          mkdir -p shots
          # Sample pinned texts / shortcuts so those screens aren't empty (simulator only).
          GROUP=$(xcrun simctl get_app_container "$SIM" com.daad.keyboard groups | awk '/group.com.daad.keyboard/ {print $2}')
          if [ -n "$GROUP" ]; then
            PL="$GROUP/Library/Preferences/group.com.daad.keyboard.plist"
            mkdir -p "$(dirname "$PL")"
            /usr/libexec/PlistBuddy -c "Add :pinnedTexts array" -c "Add :pinnedTexts:0 string 'My address: 12 Nile St, Cairo'" \
              -c "Add :pinnedTexts:1 string 'عنواني: ١٢ شارع النيل، القاهرة'" "$PL" || true
            NOW=$(date +%s)
            /usr/libexec/PlistBuddy -c "Add :diagMemoryNowMB real 61" -c "Add :diagMemoryPeakMB real 74" -c "Add :diagMemoryDate real $NOW" \
              -c "Add :diagMemoryPeakEvent string '$((NOW-120))|74|5230|selection'" \
              -c "Add :diagMemoryLog array" \
              -c "Add :diagMemoryLog:0 string '$((NOW-300))|48|0|open, clipboard 12 items / 840 chars'" \
              -c "Add :diagMemoryLog:1 string '$((NOW-200))|55|130|typing'" \
              -c "Add :diagMemoryLog:2 string '$((NOW-120))|74|5230|selection'" \
              -c "Add :diagMemoryLog:3 string '$((NOW-60))|61|5230|close'" "$PL" || true
          fi
          for LANG in ar en; do
            for SHOT in settings memory; do
              xcrun simctl terminate "$SIM" com.daad.keyboard || true
              xcrun simctl launch "$SIM" com.daad.keyboard -appLanguage $LANG -shot $SHOT
              sleep 7
              xcrun simctl io "$SIM" screenshot "shots/$SHOT-$LANG.png"
            done
          done
          ls -la shots

      - name: Save screenshots to the repo
        run: |
          mkdir -p design/review && cp shots/*.png design/review/
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add design/review && git commit -m "App screenshots from simulator" && git push
